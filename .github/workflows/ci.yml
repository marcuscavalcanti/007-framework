name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11", name: "test (3.11)"}
          - {os: ubuntu-latest, python-version: "3.12", name: "test (3.12)"}
          - {os: ubuntu-latest, python-version: "3.13", name: "test (3.13)"}
          - {os: macos-latest, python-version: "3.13", name: "test (3.13) macOS"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require offline historical proofs
        run: python -m unittest discover -s tests -p test_package.py -k historical_proofs -v
      - run: python -m py_compile scripts/*.py
      - name: Check dashboard startup on macOS
        if: runner.os == 'macOS'
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -p test_dashboard_host.py -k announces -v
      - run: python -m unittest discover -s tests -v
      - name: Verify release manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: shasum -a 256 --check "evidence/${GITHUB_REF_NAME}/manifest.sha256"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Prepare build backend
        run: python -m pip install 'setuptools>=77' pipx
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - name: Verify installed wheel
        run: python tests/check_wheel.py dist/*.whl --pipx
