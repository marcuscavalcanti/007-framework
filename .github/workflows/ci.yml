name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require offline historical proofs
        run: python -m unittest discover -s tests -p test_package.py -k historical_proofs -v
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
      - name: Verify release manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum --check "evidence/${GITHUB_REF_NAME}/manifest.sha256"
