name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require offline historical proofs
        run: python -m unittest discover -s tests -p test_package.py -k historical_proofs -v
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
      - name: Verify release manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum --check "evidence/${GITHUB_REF_NAME}/manifest.sha256"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Prepare build backend
        run: python -m pip install 'setuptools>=77' pipx
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - name: Verify installed wheel
        run: python tests/check_wheel.py dist/*.whl --pipx
