name: release preparation

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag
        required: true
        type: string
      tag_object:
        description: Exact annotated tag object SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  artifacts:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build and verify source candidate
        id: distribution
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ inputs.tag_object }}
        run: |
          set -euo pipefail
          umask 077
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ref="refs/tags/$tag"
          version="${tag#v}"
          test "$(git cat-file -t "$ref")" = tag
          commit="$(git rev-parse "$ref^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EXPECTED_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse "$ref")" = "$EXPECTED_TAG_OBJECT"
          else
            test "$commit" = "$GITHUB_SHA"
          fi
          test "$(python3 bin/007 --version)" = "007 $version"
          test -s "evidence/$tag/release-evidence.md"
          shasum -a 256 --check "evidence/$tag/manifest.sha256"
          output="$(mktemp -d "$RUNNER_TEMP/007-distribution.XXXXXX")"
          verification="$(mktemp -d "$RUNNER_TEMP/007-verify.XXXXXX")"
          archive="007-framework-$version.tar.gz"
          git archive --format=tar.gz --prefix="007-framework-$version/" -o "$output/$archive" "$ref"
          git archive --format=tar.gz --prefix="007-framework-$version/" -o "$output/repeat.tar.gz" "$ref"
          cmp "$output/$archive" "$output/repeat.tar.gz"
          rm "$output/repeat.tar.gz"
          tar -xzf "$output/$archive" -C "$verification"
          (cd "$verification/007-framework-$version" && shasum -a 256 --check "evidence/$tag/manifest.sha256")
          (cd "$output" && shasum -a 256 "$archive" > SHA256SUMS.txt)
          printf 'directory=%s\narchive=%s\n' "$output" "$output/$archive" >> "$GITHUB_OUTPUT"
      - name: Attest source build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.distribution.outputs.archive }}
      - name: Retain candidate for maintainer publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-candidate-${{ inputs.tag || github.ref_name }}
          path: ${{ steps.distribution.outputs.directory }}/*
          if-no-files-found: error
