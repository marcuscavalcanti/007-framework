name: release preparation

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build and verify source candidate
        id: distribution
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          test "$(python3 bin/007 --version)" = "007 $version"
          test -s "evidence/$GITHUB_REF_NAME/release-evidence.md"
          shasum -a 256 --check "evidence/$GITHUB_REF_NAME/manifest.sha256"
          output="$(mktemp -d "$RUNNER_TEMP/007-distribution.XXXXXX")"
          verification="$(mktemp -d "$RUNNER_TEMP/007-verify.XXXXXX")"
          archive="007-framework-$version.tar.gz"
          git archive --format=tar.gz --prefix="007-framework-$version/" -o "$output/$archive" "$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix="007-framework-$version/" -o "$output/repeat.tar.gz" "$GITHUB_REF_NAME"
          cmp "$output/$archive" "$output/repeat.tar.gz"
          rm "$output/repeat.tar.gz"
          tar -xzf "$output/$archive" -C "$verification"
          (cd "$verification/007-framework-$version" && shasum -a 256 --check "evidence/$GITHUB_REF_NAME/manifest.sha256")
          (cd "$output" && shasum -a 256 "$archive" > SHA256SUMS.txt)
          printf 'directory=%s\narchive=%s\n' "$output" "$output/$archive" >> "$GITHUB_OUTPUT"
      - name: Attest source build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.distribution.outputs.archive }}
      - name: Retain candidate for maintainer publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-candidate-${{ github.ref_name }}
          path: ${{ steps.distribution.outputs.directory }}/*
          if-no-files-found: error
